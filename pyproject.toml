[project]
name = "arth_rca"
version = "0.1.0"
description = "AI-Assisted Schedule Driver Detection & Recovery Simulation System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.19",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "networkx>=3.2.0",
    "psycopg2-binary>=2.9.9",
    "pyp6xer>=1.16.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pulp>=3.0.0",
    "scipy>=1.14.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arth_rca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
